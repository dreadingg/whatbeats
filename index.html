<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whatbeatsrock - calc edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7f5f0; /* Creamy white */
            color: #4a4a4a; /* Soft dark gray */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 380px;
        }

        .header {
            text-align: center;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 500;
            color: #333333;
            letter-spacing: 0.5px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.85rem;
            color: #888888;
            padding: 0 5px;
        }

        .top-bar span {
            color: #333333;
            font-weight: 600;
        }

        .mode-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .mode-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 0.8rem;
            background-color: #ffffff;
            color: #666666;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mode-buttons button.active {
            background-color: #333333;
            color: #ffffff;
            border-color: #333333;
        }

        .mode-buttons button:hover {
            border-color: #999999;
        }

        .turn-indicator {
            font-size: 0.85rem;
            color: #888888;
            text-align: center;
            width: 100%;
        }

        .turn-indicator span {
            color: #333333;
            font-weight: 600;
        }

        .calculator {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .screen {
            background-color: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 18px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .input-display {
            font-size: 1.8rem;
            color: #333333;
            word-wrap: break-word;
            word-break: break-all;
            font-weight: 400;
        }

        .message-display {
            font-size: 0.8rem;
            color: #999999;
            margin-top: 5px;
            min-height: 2.4em;
            line-height: 1.4;
        }

        .message-display.win {
            color: #4a7c59; /* Soft green */
        }

        .message-display.lose {
            color: #a35c5c; /* Soft red */
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            background-color: #fcfcfc;
            color: #444444;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            padding: 16px 0;
            font-size: 1.1rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        button:hover {
            background-color: #f2f2f2;
            border-color: #dddddd;
        }

        button:active {
            background-color: #e8e8e8;
        }

        button.operator {
            color: #666666;
        }

        button.equals {
            background-color: #e0e0e0;
            color: #333333;
            border-color: #d0d0d0;
        }

        button.equals:hover {
            background-color: #d5d5d5;
        }

        button.clear {
            color: #a35c5c;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">whatbeatsrock - calc edition</div>
        </div>

        <div class="top-bar">
            <div>Score: <span id="score">0</span></div>
            <div>High: <span id="highScore">0</span></div>
        </div>

        <div class="mode-buttons">
            <button id="btnSolo" class="active" onclick="setMode('solo')">Solo</button>
            <button id="btnMulti" onclick="setMode('multi')">Multiplayer</button>
            <button id="btnHard" onclick="setMode('hard')">Hard Mode</button>
        </div>

        <div class="turn-indicator hidden" id="turnIndicator">Player 1's turn</div>

        <div class="calculator">
            <div class="screen">
                <div class="input-display" id="display">0</div>
                <div class="message-display" id="message">Type a number and hit =</div>
            </div>
            <div class="buttons">
                <button class="clear" onclick="clearAll()">C</button>
                <button class="operator" onclick="appendOperator('/')">/</button>
                <button class="operator" onclick="appendOperator('*')">×</button>
                <button class="operator" onclick="deleteLast()">⌫</button>

                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="appendOperator('-')">-</button>

                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="appendOperator('+')">+</button>

                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>
                <button class="equals" onclick="submitGuess()" style="grid-row: span 2;">=</button>

                <button onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
                <button onclick="appendNumber('.')">.</button>
            </div>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let currentInput = "0";
        let previousNumber = null;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('whatBeatsHighScore')) || 0;
        let gameOver = false;
        let mode = 'solo';
        let currentPlayer = 1;
        let currentRule = null;
        let ruleCount = 0;

        const display = document.getElementById('display');
        const message = document.getElementById('message');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const turnIndicator = document.getElementById('turnIndicator');

        // --- RULE DEFINITIONS ---
        const rules = [
            {
                id: 'beats',
                name: 'BEATS',
                weight: 30,
                desc: 'What BEATS',
                check: (guess, prev) => guess > prev,
                successMsg: (guess, prev) => `${guess} beats ${prev}.`,
                failMsg: (guess, prev) => `${guess} does NOT beat ${prev}.`
            },
            {
                id: 'doesntBeat',
                name: 'DOESNT BEAT',
                weight: 25,
                desc: 'What DOESNT BEAT',
                check: (guess, prev) => guess < prev,
                successMsg: (guess, prev) => `${guess} doesn't beat ${prev}.`,
                failMsg: (guess, prev) => `${guess} DOES beat ${prev}.`
            },
            {
                id: 'divides',
                name: 'DIVIDES',
                weight: 15,
                desc: 'What DIVIDES',
                check: (guess, prev) => prev !== 0 && guess !== 0 && prev % guess === 0,
                successMsg: (guess, prev) => `${guess} divides ${prev}.`,
                failMsg: (guess, prev) => `${guess} does NOT divide ${prev}.`
            },
            {
                id: 'factorOf',
                name: 'IS A FACTOR OF',
                weight: 15,
                desc: 'What IS A FACTOR OF',
                check: (guess, prev) => guess !== 0 && prev % guess === 0,
                successMsg: (guess, prev) => `${guess} is a factor of ${prev}.`,
                failMsg: (guess, prev) => `${guess} is NOT a factor of ${prev}.`
            },
            {
                id: 'multipliesInto',
                name: 'MULTIPLIED BY SOMETHING GIVES',
                weight: 8,
                desc: 'What MULTIPLIED BY SOMETHING GIVES',
                check: (guess, prev) => guess !== 0 && prev % guess === 0,
                successMsg: (guess, prev) => `${guess} x ${prev/guess} = ${prev}.`,
                failMsg: (guess, prev) => `${guess} doesn't multiply into ${prev}.`
            },
            {
                id: 'modulo',
                name: 'MODULO',
                weight: 5,
                desc: 'What MODULO',
                check: (guess, prev) => guess !== 0 && (prev % guess) === 0,
                successMsg: (guess, prev) => `${prev} mod ${guess} = 0.`,
                failMsg: (guess, prev) => `${prev} mod ${guess} does not equal 0.`
            },
            {
                id: 'power',
                name: 'POWER OF',
                weight: 3,
                desc: 'What is a POWER OF',
                check: (guess, prev) => guess > 1 && prev > 1 && Number.isInteger(Math.log(prev) / Math.log(guess)),
                successMsg: (guess, prev) => `${guess} is a power of ${prev}.`,
                failMsg: (guess, prev) => `${guess} is NOT a power of ${prev}.`
            }
        ];

        function pickWeightedRule() {
            const totalWeight = rules.reduce((sum, r) => sum + r.weight, 0);
            let random = Math.random() * totalWeight;
            for (const rule of rules) {
                random -= rule.weight;
                if (random <= 0) return rule;
            }
            return rules[0];
        }

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('btnSolo').classList.toggle('active', mode === 'solo');
            document.getElementById('btnMulti').classList.toggle('active', mode === 'multi');
            document.getElementById('btnHard').classList.toggle('active', mode === 'hard');
            
            clearAll();
            
            if (mode === 'multi') {
                turnIndicator.classList.remove('hidden');
                turnIndicator.textContent = "Player 1's turn";
            } else {
                turnIndicator.classList.add('hidden');
            }
        }

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function updateHighScore() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('whatBeatsHighScore', highScore);
            }
            highScoreDisplay.textContent = highScore;
        }

        function appendNumber(num) {
            if (gameOver) return;
            if (currentInput === "0" && num !== ".") {
                currentInput = num;
            } else {
                if (num === "." && currentInput.includes(".")) return;
                currentInput += num;
            }
            updateDisplay();
            message.textContent = "";
            message.className = "message-display";
        }

        function appendOperator(op) {
            if (gameOver) return;
            if (currentInput === "0" && (op === '*' || op === '/')) return;
            if (currentInput.endsWith('+') || currentInput.endsWith('-') || currentInput.endsWith('*') || currentInput.endsWith('/')) {
                currentInput = currentInput.slice(0, -1);
            }
            currentInput += op;
            updateDisplay();
        }

        function deleteLast() {
            if (gameOver) return;
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = "0";
            previousNumber = null;
            score = 0;
            gameOver = false;
            currentPlayer = 1;
            currentRule = null;
            ruleCount = 0;
            scoreDisplay.textContent = "0";
            message.textContent = "Type a number and hit =";
            message.className = "message-display";
            turnIndicator.textContent = "Player 1's turn";
            updateDisplay();
        }

        function submitGuess() {
            if (gameOver) return;

            let value;
            try {
                value = Function('"use strict";return (' + currentInput + ')')();
            } catch (e) {
                message.textContent = "Invalid math.";
                message.className = "message-display lose";
                return;
            }

            if (isNaN(value) || !isFinite(value)) {
                message.textContent = "That's not a number.";
                message.className = "message-display lose";
                return;
            }
            value = Math.round(value * 100) / 100;

            // FIRST MOVE
            if (previousNumber === null) {
                previousNumber = value;
                if (mode === 'hard') {
                    currentRule = pickWeightedRule();
                    ruleCount = 1;
                    message.textContent = `${value}. Now: ${currentRule.desc} ${value}?`;
                } else {
                    currentRule = rules[0];
                    message.textContent = `${value}. What beats ${value}?`;
                }
                message.className = "message-display win";
                score++;
                updateHighScore();
                scoreDisplay.textContent = score;
                currentInput = "0";
                updateDisplay();
                
                if (mode === 'multi') {
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    turnIndicator.textContent = `Player ${currentPlayer}'s turn`;
                }
                return;
            }

            // SUBSEQUENT MOVES
            if (mode === 'hard') {
                ruleCount++;
                if (ruleCount > 2) {
                    currentRule = pickWeightedRule();
                    ruleCount = 1;
                    message.textContent = `New rule: ${currentRule.desc} ${previousNumber}?`;
                    message.className = "message-display win";
                    currentInput = "0";
                    updateDisplay();
                    return;
                }
            }

            const passed = currentRule.check(value, previousNumber);

            if (passed) {
                const oldValue = previousNumber; // Store the old number for the message
                previousNumber = value;
                score++;
                updateHighScore();
                scoreDisplay.textContent = score;
                
                message.textContent = currentRule.successMsg(value, oldValue); // Pass old value to message
                message.className = "message-display win";
                
                currentInput = "0";
                updateDisplay();

                if (mode === 'hard') {
                    message.textContent += ` Now: ${currentRule.desc} ${previousNumber}?`;
                } else {
                    message.textContent += ` What beats ${previousNumber}?`;
                }

                if (mode === 'multi') {
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    turnIndicator.textContent = `Player ${currentPlayer}'s turn`;
                }
            } else {
                message.textContent = currentRule.failMsg(value, previousNumber);
                message.className = "message-display lose";
                gameOver = true;
                currentInput = "0";
                updateDisplay();
            }
        }

        highScoreDisplay.textContent = highScore;
        updateDisplay();
    </script>
</body>
</html>
